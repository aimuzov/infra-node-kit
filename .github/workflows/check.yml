name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - name: Reuse verified CI
        id: verified
        uses: aimuzov/infra-ci/reuse-check@v1
        continue-on-error: true
        with:
          workflow: .github/workflows/check.yml
          matrix: ${{ toJSON(matrix) }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: steps.verified.outputs.reused != 'true'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}
          cache: npm
        if: steps.verified.outputs.reused != 'true'
      - run: npm ci
        if: steps.verified.outputs.reused != 'true'
      - run: npm run format:check
        if: steps.verified.outputs.reused != 'true'
      - run: npm test
        if: steps.verified.outputs.reused != 'true'
      - run: npm run check
        if: steps.verified.outputs.reused != 'true'
      - run: npm pack --dry-run
        if: steps.verified.outputs.reused != 'true'
      - name: Record verified CI
        if: github.event_name == 'pull_request' && steps.verified.outputs.reused != 'true'
        uses: aimuzov/infra-ci/record-check@v1
        continue-on-error: true
        with:
          workflow: .github/workflows/check.yml
          matrix: ${{ toJSON(matrix) }}
